<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gallius logo">
  <defs>
    <radialGradient id="disc" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#3558A0"/>
      <stop offset="45%" stop-color="#1A2F66"/>
      <stop offset="100%" stop-color="#0A1430"/>
    </radialGradient>
    <radialGradient id="lens" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#9AD4FF"/>
      <stop offset="40%" stop-color="#3B7BE8"/>
      <stop offset="100%" stop-color="#163A8C"/>
    </radialGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48CFF"/>
      <stop offset="100%" stop-color="#7A2FD4"/>
    </linearGradient>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="55%" stop-color="#F0A832"/>
      <stop offset="100%" stop-color="#D06A18"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AF5F0"/>
      <stop offset="100%" stop-color="#1AA8C0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C070FF"/>
      <stop offset="100%" stop-color="#6B28B8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BE8C8"/>
      <stop offset="100%" stop-color="#1E8FB0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer cosmic disc -->
  <circle cx="256" cy="256" r="248" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#4A6BB8" stroke-width="8" opacity="0.45"/>
  <!-- subtle swirl accents -->
  <path d="M70 220 C120 120, 220 70, 330 90" fill="none" stroke="#6BE8C8" stroke-width="3" opacity="0.35"/>
  <path d="M390 140 C460 220, 450 340, 380 420" fill="none" stroke="#C070FF" stroke-width="3" opacity="0.28"/>
  <path d="M120 400 C180 460, 300 470, 390 400" fill="none" stroke="#F0A832" stroke-width="2.5" opacity="0.22"/>

  <!-- Faceted G: thick open ring + inward crossbar -->
  <g filter="url(#softShadow)">
    <!-- top-left purple facet -->
    <path fill="url(#purple)" d="
      M256 78
      A178 178 0 0 1 372 118
      L330 168
      A112 112 0 0 0 256 144
      Z"/>
    <!-- top gold/orange facet -->
    <path fill="url(#gold)" d="
      M372 118
      A178 178 0 0 1 430 230
      L362 242
      A112 112 0 0 0 330 168
      Z"/>
    <!-- right cyan crossbar of G (points inward to lens) -->
    <path fill="url(#cyan)" d="
      M430 230
      L430 300
      L300 300
      L300 252
      L362 242
      Z"/>
    <!-- bottom-right violet -->
    <path fill="url(#violet)" d="
      M430 300
      A178 178 0 0 1 340 420
      L310 352
      A112 112 0 0 0 362 300
      L430 300
      Z"/>
    <!-- bottom purple -->
    <path fill="url(#purple)" d="
      M340 420
      A178 178 0 0 1 150 400
      L196 334
      A112 112 0 0 0 310 352
      Z"/>
    <!-- left teal -->
    <path fill="url(#teal)" d="
      M150 400
      A178 178 0 0 1 78 256
      L144 256
      A112 112 0 0 0 196 334
      Z"/>
    <!-- upper-left teal/purple close (keeps G open at top-right) -->
    <path fill="url(#teal)" d="
      M78 256
      A178 178 0 0 1 150 112
      L196 176
      A112 112 0 0 0 144 256
      Z"/>
    <!-- facet highlight edges -->
    <path fill="#FFFFFF" opacity="0.16" d="
      M256 78
      A178 178 0 0 1 372 118
      L330 168
      A112 112 0 0 0 256 144
      Z"/>
    <path fill="#FFFFFF" opacity="0.12" d="
      M430 230
      L430 265
      L300 265
      L300 252
      L362 242
      Z"/>
  </g>

  <!-- Center lens stack -->
  <circle cx="256" cy="256" r="92" fill="#0E1C38"/>
  <circle cx="256" cy="256" r="78" fill="none" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="256" cy="256" r="68" fill="url(#lens)"/>
  <ellipse cx="232" cy="232" rx="18" ry="12" fill="#FFFFFF" opacity="0.35"/>

  <!-- Camera glyph -->
  <g fill="#F3E7D3">
    <rect x="226" y="246" width="60" height="38" rx="8"/>
    <path d="M238 246 L248 232 H264 L274 246 Z"/>
    <circle cx="256" cy="265" r="11" fill="#173A7A"/>
    <circle cx="256" cy="265" r="5.5" fill="#F3E7D3"/>
    <rect x="270" y="252" width="8" height="6" rx="2" fill="#173A7A" opacity="0.7"/>
  </g>
</svg>
